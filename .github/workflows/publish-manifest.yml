name: Publish release manifest
run-name: ${{ inputs.tag || github.event.release.tag_name }} Asset Packaging

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose manifest should be repaired
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  package-release:
    uses: ./.github/workflows/package-release.yml
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
